<div class="row">
    <img src="{{book()?.volumeInfo?.imageLinks?.smallThumbnail}}" alt="logo" class="book-img">
    <div class="title-wrapper">
        <span class="title">
            {{book()?.volumeInfo?.title}}
        </span>
        <div class="authors">
            @for (author of book()?.volumeInfo?.authors; track author) {
                <span>{{author}}</span>
            }
            <div class="year">{{book()?.volumeInfo?.publishedDate}}</div>
        </div>
        <span class="version">{{book()?.volumeInfo?.contentVersion}}</span>
    </div>
    <div class="rating-wrapper">
        <span class="rating-value">{{book()?.volumeInfo?.averageRating}}</span><span class="rating-max">/5</span>
    </div>
    <div class="category-wrapper">
        <span class="main-category">{{book()?.volumeInfo?.categories?.[0]}}</span>
    </div>
    <div class="button-wrapper">
        <button class="heart-btn" [class.active]="liked" (click)="toggleLike()">
            <svg class="heart-icon" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
               2 5.42 4.42 3 7.5 3c1.74 0 3.41 0.81 4.5 2.09
               C13.09 3.81 14.76 3 16.5 3
               19.58 3 22 5.42 22 8.5
               c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </button>
        <button class="preview-btn" (click)="onPreview()">Preview</button>
    </div>
</div>
